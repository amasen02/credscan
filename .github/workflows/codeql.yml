# ---------------------------------------------------------------------------
# CodeQL — static security analysis for Python. Findings appear under the
# Security tab.
# ---------------------------------------------------------------------------
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'        # weekly, Monday 06:17 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: python
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:python'
