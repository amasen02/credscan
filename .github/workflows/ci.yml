# ---------------------------------------------------------------------------
# CI: lint (ruff) and test (pytest) on every push to main.
# Tests are deterministic and offline; git-integration tests use throwaway repos
# created in pytest's tmp_path, not the checkout itself.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint · Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - name: Dependency audit
        run: |
          python -m pip install --quiet --upgrade pip pip-audit
          # Audit exact installed third-party versions. The unpublished editable project is
          # excluded by location, rather than ignored through a non-strict audit failure.
          python -c "from importlib.metadata import distributions; from pathlib import Path; root=Path.cwd().resolve(); local=lambda d:d.locate_file('').resolve().is_relative_to(root) or d.read_text('direct_url.json') is not None; records=sorted({d.name+'=='+d.version for d in distributions() if not local(d)}); Path('.pip-audit-requirements.txt').write_text(chr(10).join(records)+chr(10), encoding='utf-8')"
          python -m pip_audit --strict --no-deps --requirement .pip-audit-requirements.txt
