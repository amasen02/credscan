# ---------------------------------------------------------------------------
# CI: lint (ruff) and test (pytest) on every push to main.
# Tests are deterministic and offline; git-integration tests use throwaway repos
# created in pytest's tmp_path, not the checkout itself.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint · Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - name: Dependency audit
        run: |
          python -m pip install --quiet --upgrade pip pip-audit
          # Audit exact installed third-party versions. The unpublished editable project is
          # excluded only when its parsed local source is exactly this checkout.
          python scripts/generate_audit_requirements.py --root . --output .pip-audit-requirements.txt
          python -m pip_audit --strict --no-deps --requirement .pip-audit-requirements.txt
